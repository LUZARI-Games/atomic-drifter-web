# Builds, tests and deploys to Cloudflare Workers.
# - push to main     -> live deploy
# - push to a branch -> preview version with its own URL (see the run summary)
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # includes typecheck

      - name: Deploy live (main)
        if: github.ref == 'refs/heads/main'
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' deploy.log | head -1)
          echo "### Live: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview (branch)
        if: github.ref != 'refs/heads/main'
        run: |
          alias=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//' | cut -c1-30 | sed -E 's/-+$//')
          # The Worker must exist before versions can be uploaded; create it on the very first run.
          if ! npx wrangler deployments list >/dev/null 2>&1; then
            npx wrangler deploy
          fi
          npx wrangler versions upload --preview-alias "$alias" | tee upload.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' upload.log | tail -1)
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
